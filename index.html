<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테일즈런너 점령전 진행 안내 사항</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --accent: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --kakao-yellow: #FEE500;
            --kakao-text: #191919;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px dashed var(--border-color);
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 24px;
            color: var(--text-main);
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .notice-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .notice-item {
            background: rgba(15, 23, 42, 0.6);
            padding: 16px;
            border-radius: 12px;
            border-left: 4px solid var(--primary);
            font-size: 15px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .notice-item.highlight {
            border-left-color: var(--accent);
            background: rgba(244, 63, 94, 0.1);
        }

        .notice-item .icon {
            font-size: 18px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .notice-item .content {
            flex-grow: 1;
        }

        .price-tag {
            font-weight: 800;
            color: var(--accent);
            font-size: 18px;
        }

        .sub-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }
